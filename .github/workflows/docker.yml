name: Build and Push Docker Image

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # --- НОВЫЕ ШАГИ: ПРОВЕРКА КОДА ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./docker-node-app/package-lock.json
          
      - name: Install dependencies
        working-directory: ./docker-node-app
        run: npm ci
        
      - name: Run tests / Type check
        working-directory: ./docker-node-app
        # Здесь можно написать npm run test или npm run build (для TS)
        run: npm run test 
      # -----------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-node-app
          file: ./docker-node-app/Dockerfile
          push: true
          tags: heltoe/task-api:latest,heltoe/task-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max