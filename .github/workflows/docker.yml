name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # --- ПРОВЕРКА КОДА (опционально) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Убрали cache и cache-dependency-path - они вызывали ошибку
          
      - name: Install dependencies
        working-directory: ./docker-node-app
        run: npm install
        
      - name: Run tests / Type check
        working-directory: ./docker-node-app
        run: npm run test 
      # -----------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-node-app
          file: ./docker-node-app/Dockerfile
          push: true
          tags: heltoe/task-api:latest,heltoe/task-api:${{ github.sha }}
          # Кэширование Docker-слоев оставили - оно работает отлично
          cache-from: type=gha
          cache-to: type=gha,mode=max