name: Build and Push Docker Image

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Указываем папку, где лежит проект, как контекст сборки
          context: ./docker-node-app
          
          # Явно указываем путь к Dockerfile внутри этой папки 
          # (если он называется Dockerfile.production, замени на ./docker-node-app/Dockerfile.production)
          file: ./docker-node-app/Dockerfile.production
          
          push: true
          tags: heltoe/task-api:latest,heltoe/task-api:${{ github.sha }}
          
          # Кэширование для ускорения последующих сборок
          cache-from: type=gha
          cache-to: type=gha,mode=max